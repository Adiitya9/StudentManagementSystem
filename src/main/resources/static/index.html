<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Management System</h1>
            <p>Manage your students efficiently</p>
        </header>

        <div class="content">
            <!-- Form Section -->
            <section class="form-section">
                <h2 id="formTitle">Add New Student</h2>
                <form id="studentForm">
                    <div class="form-group">
                        <label for="studentName">Name:</label>
                        <input type="text" id="studentName" required placeholder="Enter student name">
                    </div>
                    <div class="form-group">
                        <label for="studentEmail">Email:</label>
                        <input type="email" id="studentEmail" required placeholder="Enter email">
                    </div>
                    <div class="form-group">
                        <label for="studentPhone">Phone:</label>
                        <input type="tel" id="studentPhone" required placeholder="Enter phone number">
                    </div>
                    <div class="button-group">
                        <button type="submit" id="submitBtn">Add Student</button>
                        <button type="button" id="cancelBtn" style="display:none;">Cancel</button>
                    </div>
                </form>
            </section>

            <!-- Table Section -->
            <section class="table-section">
                <h2>All Students</h2>
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                    </tbody>
                </table>
                <p id="noDataMessage" style="display:none; text-align:center; color:#666;">No students found</p>
            </section>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api/students';
        let editingId = null;

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            loadStudents();
            document.getElementById('studentForm').addEventListener('submit', handleFormSubmit);
            document.getElementById('cancelBtn').addEventListener('click', resetForm);
        });

        // Fetch and display all students
        async function loadStudents() {
            try {
                const response = await fetch(API_BASE_URL);
                const students = await response.json();
                displayStudents(students);
            } catch (error) {
                console.error('Error loading students:', error);
                alert('Error loading students');
            }
        }

        // Display students in table
        function displayStudents(students) {
            const tableBody = document.getElementById('studentTableBody');
            const noDataMsg = document.getElementById('noDataMessage');
            const table = document.getElementById('studentTable');

            if (students.length === 0) {
                tableBody.innerHTML = '';
                table.style.display = 'none';
                noDataMsg.style.display = 'block';
                return;
            }

            table.style.display = 'table';
            noDataMsg.style.display = 'none';
            tableBody.innerHTML = '';

            students.forEach(student => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>${student.phone}</td>
                    <td>
                        <button class="btn-edit" onclick="editStudent(${student.id}, '${student.name}', '${student.email}', '${student.phone}')">Edit</button>
                        <button class="btn-delete" onclick="deleteStudent(${student.id})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Handle form submission
        async function handleFormSubmit(e) {
            e.preventDefault();

            const name = document.getElementById('studentName').value;
            const email = document.getElementById('studentEmail').value;
            const phone = document.getElementById('studentPhone').value;

            const studentData = { name, email, phone };

            try {
                let response;
                if (editingId) {
                    // Update existing student
                    response = await fetch(`${API_BASE_URL}/${editingId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(studentData)
                    });
                } else {
                    // Create new student
                    response = await fetch(API_BASE_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(studentData)
                    });
                }

                if (response.ok) {
                    alert(editingId ? 'Student updated successfully!' : 'Student added successfully!');
                    resetForm();
                    loadStudents();
                } else {
                    alert('Error saving student');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error saving student');
            }
        }

        // Edit student
        function editStudent(id, name, email, phone) {
            editingId = id;
            document.getElementById('formTitle').textContent = 'Edit Student';
            document.getElementById('studentName').value = name;
            document.getElementById('studentEmail').value = email;
            document.getElementById('studentPhone').value = phone;
            document.getElementById('submitBtn').textContent = 'Update Student';
            document.getElementById('cancelBtn').style.display = 'inline-block';
            document.getElementById('studentForm').scrollIntoView({ behavior: 'smooth' });
        }

        // Delete student
        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('Student deleted successfully!');
                    loadStudents();
                } else {
                    alert('Error deleting student');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error deleting student');
            }
        }

        // Reset form
        function resetForm() {
            document.getElementById('studentForm').reset();
            document.getElementById('formTitle').textContent = 'Add New Student';
            document.getElementById('submitBtn').textContent = 'Add Student';
            document.getElementById('cancelBtn').style.display = 'none';
            editingId = null;
        }
    </script>
</body>
</html>
